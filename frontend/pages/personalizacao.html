<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../logoicone/logo_codeburger.png" type="image/x-icon">
  <title>Personalizar Pedido</title>
  <link rel="stylesheet" href="../css/personalizacao.css">
</head>
<body>
  <header class="header">
        <a href="../index.html" class="logo-link">
            <h1>Code <span>•</span> Burger</h1>
        </a>
    </header>

  <main class="container">
    <section class="produto">
      <img id="burger-image" src="" alt="Imagem do lanche">
      <h2 id="burger-name">Nome do Lanche</h2>
      <p class="descricao">Experimente essa combinação que está irresistível!</p>
      <p id="burger-price" class="preco">R$ 00,00</p>
      <button class="btn-add">Adicionar ao carrinho</button>
    </section>

    <section class="extras">
      <h3>Personalize seu produto</h3>

      <ul class="lista-extras" id="lista-extras"> </ul>
      
    </section>
  </main>

  <footer class="footer">
    <p>Code <span>Burguer</span></p>
  </footer>

<script src="../js/utils.js"></script>
<script src="../js/personalizacao.js"></script>
<script src="../js/global.js"></script>

</html>
